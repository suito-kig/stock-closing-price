name: Post JP Indices to Discord (Nikkei)

on:
  schedule:
    # UTC 06:35 = JST 15:35(同日)
    # 曜日指定(月〜金 = 1-5)で土日は実行しないようにしている
    - cron: "35 6 * * 1-5"
  workflow_dispatch: {}  # Actionsタブから手動実行もできるようにする

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post JP indices to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python post_indices.py --group jp

  # GitHubはパブリックリポジトリに60日間動きがないとscheduledワークフローを自動停止する。
  # それを防ぐため、定期実行のたびにAPI経由でこのワークフローを再有効化する(ダミーコミット不要)。
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
